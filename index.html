<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./desktop.css">
    <script src="./desktop.js" defer></script>

    <script type="importmap">
      {
        "imports": {
          "lit": "https://cdn.jsdelivr.net/npm/lit@3.3.0/+esm",
          "@m3e/core": "./node_modules/@m3e/core/dist/index.min.js",
          "@m3e/core/a11y": "./node_modules/@m3e/core/dist/a11y.min.js",
          "@m3e/core/anchoring": "./node_modules/@m3e/core/dist/anchoring.min.js",
          "@m3e/core/bidi": "./node_modules/@m3e/core/dist/bidi.min.js",
          "@m3e/core/layout": "./node_modules/@m3e/core/dist/layout.min.js",
          "@m3e/core/platform": "./node_modules/@m3e/core/dist/platform.min.js"
        }
      }
    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="./node_modules/@m3e/button/dist/index.min.js"></script>
    <script type="module" src="./node_modules/@m3e/nav-menu/dist/index.min.js"></script>
    <script type="module" src="./node_modules/@m3e/icon/dist/index.min.js"></script>
    <script type="module" src="./node_modules/@m3e/divider/dist/index.min.js"></script>
    <script type="module" src="./node_modules/@m3e/heading/dist/index.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="entry" id="entry-chrome">
      <img src="./assets/chrome.svg" height="50" width="50" />
      <p>Chrome</p>
    </div>
    <div class="entry" id="entry-files">
      <img src="./assets/files.webp" height="50" width="50" />
      <p>Files</p>
    </div>
    <div class="entry" id="entry-settings">
      <img src="./assets/settings.webp" height="50" width="50" />
      <p>Settings</p>
    </div>
    <div class="entry" id="entry-add">
      <img src="./assets/add.webp" height="50" width="50" />
      <p>Add an app</p>
    </div>
    <iframe id="widget" src="https://free.timeanddate.com/clock/i8tygyva/n102/szw210/szh210/hocddd/hbw0/hfc000/cf100/hgr0/fav0/fiv0/mqcfff/mql15/mqw8/mqd100/mhcfff/mhl15/mhw4/mhd100/mmv0/hhcfff/hhw11/hmcfff/hmw6/hsw4" frameborder="0" width="210" height="210"></iframe>

    <div id="escmenu_modal_overlay" class="modal_overlay">
      <div id="escmenu_modal" class="modal">
        <m3e-button variant="filled" id="open_settingsmenu_modal">設定</m3e-button>
        <m3e-button variant="filled" id="close_menu_modal">とじる</m3e-button>
        <m3e-button variant="filled" id="open_change_widget_position_modal">位置の変更</m3e-button>
      </div>
    </div>

    <div id="change_widget_position_modal_overlay" class="modal_overlay">
      <div id="change_widget_position_modal" class="modal">
        <m3e-button variant="filled" id="close_change_widget_position_modal">とじる</m3e-button>
      </div>

    </div>

    <div id="settingsmenu_modal_overlay" class="modal_overlay">
      <div id="settingsmenu_modal" class="modal">
<div id="settings_sidebar">
<m3e-nav-menu>
  <m3e-nav-menu-item-group>
    <m3e-heading slot="label" variant="label" size="large">一般</m3e-heading>
    <m3e-nav-menu-item>
      <m3e-icon slot="icon" name="keyboard"></m3e-icon>
      <span slot="label">キーボードショートカット</span>
    </m3e-nav-menu-item>
    <m3e-nav-menu-item>
      <m3e-icon slot="icon" name="palette"></m3e-icon>
      <span slot="label">デザインとスタイル</span>
    </m3e-nav-menu-item>
    <m3e-nav-menu-item>
      <m3e-icon slot="icon" name="shield"></m3e-icon>
      <span slot="label">セキュリティとプライバシー</span>
    </m3e-nav-menu-item>
    <m3e-nav-menu-item>
      <m3e-icon slot="icon" name="account_circle"></m3e-icon>
      <span slot="label">アカウント</span>
    </m3e-nav-menu-item>
    <!-- Additional items omitted for brevity -->
  </m3e-nav-menu-item-group>
  <m3e-nav-menu-item-group>
    <m3e-nav-menu-item>
      <m3e-icon slot="icon" name="developer_board"></m3e-icon>
      <span slot="label">デバッグ</span>
    </m3e-nav-menu-item>
    <m3e-heading slot="label" variant="label" size="large">開発者向け設定</m3e-heading>
    <m3e-nav-menu-item>
      <m3e-icon slot="icon" name="info"></m3e-icon>
      <span slot="label">バージョン情報</span>
    </m3e-nav-menu-item>
    <!-- Additional items omitted for brevity -->
  </m3e-nav-menu-item-group>
</m3e-nav-menu>
</div>
        <m3e-button variant="filled" id="close_settingsmenu_modal">とじる</m3e-button>
      </div>
    </div>
  </body>
</html>
